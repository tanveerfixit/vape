<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --tap-size: 48px;
    }
    .touch-field {
      min-height: var(--tap-size);
      font-size: 16px;
    }
    .touch-btn {
      min-height: var(--tap-size);
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">

<main class="max-w-6xl mx-auto p-2 md:p-4 pb-6 md:pb-4 grid grid-cols-1 lg:grid-cols-3 gap-3 md:gap-4">
  <div class="lg:col-span-3 flex justify-end">
    <button id="toggleDbBtn" onclick="toggleLocalDbPanel()"
      class="text-xs px-3 py-2 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold touch-btn">
      Add Category
    </button>
  </div>

  <!-- PRODUCT INPUT -->
  <section class="lg:col-span-2 space-y-3">

    <div class="bg-white rounded-lg shadow-sm p-3 md:p-4">
      <h2 class="font-bold text-lg mb-3 border-b pb-2 text-green-700">Add Item</h2>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-3">
        <div class="flex flex-col">
            <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Category</label>
            <select id="category" class="touch-field border p-3 rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-green-500 outline-none"></select>
        </div>
        <div class="flex flex-col">
            <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Brand</label>
            <select id="brand" class="touch-field border p-3 rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-green-500 outline-none"></select>
        </div>
        <div class="flex flex-col">
            <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Model/Line</label>
            <select id="line" class="touch-field border p-3 rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-green-500 outline-none"></select>
        </div>
        <div class="flex flex-col">
          <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Flavor</label>
          <input id="flavour" list="flavourList"
            placeholder="Search or type flavor..."
            class="touch-field border p-3 rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-green-500 outline-none w-full"
            autocomplete="off">
          <p id="flavourHint" class="text-[10px] text-slate-500 mt-1 ml-1 h-3"></p>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-[100px_1fr] gap-2">
        <div class="flex flex-col">
            <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Quantity</label>
            <input id="qty" type="number" min="1" value="1"
            class="touch-field border p-3 rounded-lg bg-slate-50 text-center font-bold focus:ring-2 focus:ring-green-500 outline-none"
            inputmode="numeric">
        </div>
        <button id="addToOrderBtn" type="button"
          class="touch-btn bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md active:scale-95 transition-transform sm:mt-5">
          Add to Order
        </button>
      </div>
    </div>

    <div id="localDbPanel" class="hidden bg-white rounded-lg shadow-sm p-3 md:p-4">
      <h2 class="font-bold text-lg mb-3 border-b pb-2 text-slate-700">Local Product Database</h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        <div class="md:col-span-2 flex flex-col">
          <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">New Category</label>
          <input id="newCategory" type="text" placeholder="e.g. Pod Kits"
            class="touch-field border p-3 rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-green-500 outline-none">
        </div>
        <button onclick="addCategory()"
          class="touch-btn bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg shadow-md active:scale-95 transition-transform md:mt-5">
          Add Category
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div class="flex flex-col">
          <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Category</label>
          <select id="manageCategory" class="touch-field border p-3 rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-green-500 outline-none"></select>
        </div>
        <div class="flex flex-col">
          <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Brand</label>
          <input id="newBrand" type="text" placeholder="e.g. Vaporesso"
            class="touch-field border p-3 rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-green-500 outline-none">
        </div>
        <div class="flex flex-col">
          <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Model/Line</label>
          <input id="newLine" type="text" placeholder="e.g. XROS 4"
            class="touch-field border p-3 rounded-lg bg-slate-50 text-sm focus:ring-2 focus:ring-green-500 outline-none">
        </div>
        <button onclick="addBrandEntry()"
          class="touch-btn bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md active:scale-95 transition-transform md:mt-5">
          Add Brand
        </button>
      </div>
    </div>

    <!-- ORDER TABLE -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
      <div class="p-3 border-b flex justify-between items-center bg-white">
        <h2 class="font-bold">Current Items</h2>
        <span id="itemCount" class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded-full font-bold">0 Items</span>
      </div>

      <div class="overflow-x-auto">
          <table class="w-full text-xs md:text-sm">
            <thead class="bg-slate-50 text-slate-500 border-b">
              <tr>
                <th class="p-3 text-left w-8">#</th>
                <th class="p-3 text-left">Product</th>
                <th class="p-3 text-left">Flavor</th>
                <th class="p-3 text-right">Qty</th>
                <th class="p-3 text-right w-16">Del</th>
              </tr>
            </thead>
            <tbody id="orderTable" class="divide-y">
                <tr>
                    <td colspan="5" class="p-8 text-center text-slate-400 italic">No items added yet.</td>
                </tr>
            </tbody>
          </table>
      </div>
    </div>

  </section>

  <!-- COPY ORDER -->
  <aside>
    <div class="bg-white rounded-lg shadow-sm p-3 md:p-4 lg:sticky lg:top-4">
      <h2 class="font-bold mb-3 border-b pb-2">Order Summary</h2>

      <textarea id="orderOutput" rows="12" readonly
        class="w-full border border-slate-200 p-3 rounded-lg text-xs bg-slate-50 font-mono focus:outline-none focus:ring-0 whitespace-pre touch-field" 
        placeholder="WhatsApp text preview..."></textarea>

      <button onclick="copyOrder()"
        class="touch-btn mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-md flex items-center justify-center gap-2 active:scale-95 transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        Copy for WhatsApp
      </button>

      <div id="msgContainer" class="hidden mt-3 p-2 bg-green-50 border border-green-200 rounded text-center">
         <p id="msg" class="text-xs text-green-700 font-bold"></p>
      </div>
    </div>
  </aside>

</main>

<script>
/* PRODUCT DATABASE */
/* PRODUCT DATABASE */
const PRODUCT_STORAGE_KEY = "vap-products-db";
const CATEGORY_STORAGE_KEY = "vap-categories-db";

const defaultProducts = [
  { category: "Disposable Vape", brand: "Lost Mary", line: "BM6000" },
  { category: "Prefilled Pods", brand: "Lost Mary", line: "BM6000 Replacement Prefilled Pod" },
  { category: "Disposable Vape", brand: "Lost Mary", line: "4in1" },
  { category: "Disposable Vape", brand: "IVG", line: "Smart 5500" },
  { category: "Disposable Vape", brand: "IVG", line: "2400" },
  { category: "Disposable Vape", brand: "Elf Bar", line: "AF5000" }, // Corrected from BC5000 based on image
  { category: "Disposable Vape", brand: "Elf Bar", line: "4in1" },
  { category: "E-Liquid (Nic Salt)", brand: "ELFLIQ", line: "Nic Salts Series" },
  { category: "E-Liquid (Nic Salt)", brand: "MaryLiq", line: "Nic Salts Series" },
  { category: "Nicotine Pouches", brand: "Cuba", line: "Ninja / White" },
  { category: "Nicotine Pouches", brand: "Killa", line: "Extra Strong" },
  { category: "Nicotine Pouches", brand: "Pablo", line: "Exclusive" },
  { category: "Caffeine Pouches", brand: "Booster", line: "Strong" }
];

let products = loadProducts();
let categories = loadCategories();

/* FLAVOUR SUGGESTIONS */
const flavourMasterList = [...new Set([
  "Banana",
  "Banana Ice",
  "Banana Strawberry",
  "Berry Ice",
  "Blackcurrant",
  "Blackcurrant Apple",
  "Blackcurrant Ice",

  "Citrus Ice",
  "Cola",
  "Cola Ice",
  "Cool Mint",
  "Cotton Candy",
  "Custard",
  "Double Apple",
  "Energy Drink",

  "Pink Lemonade",
  "Rainbow Candy",
  "Raspberry",
  "Raspberry Ice",
  "Raspberry Peach",
  "Sour Apple",
  "Sour Blue Razz",
  "Sour Cherry",
  "Spearmint",
  "Strawberry",
  "Strawberry Banana",
  "Strawberry Cherry",
  "Strawberry Grape",
  "Strawberry Ice",
  "Strawberry Kiwi",
  "Strawberry Lemonade",
  "Strawberry Raspberry",
  "Strawberry Raspberry Cherry Ice",
  "Strawberry Watermelon",
  "Summer Grape",
  "Tropical Ice",
  "Tropical Punch",
  "Triple Melon",
  "Vanilla Ice Cream",
  "Watermelon",
  "Watermelon Ice"
])].sort((a, b) => a.localeCompare(b));


/* STATE */
let order = [];

/* INIT SELECTORS */
const categoryEl = document.getElementById("category");
const brandEl = document.getElementById("brand");
const lineEl = document.getElementById("line");
const addToOrderBtnEl = document.getElementById("addToOrderBtn");
const manageCategoryEl = document.getElementById("manageCategory");
const newCategoryEl = document.getElementById("newCategory");
const newBrandEl = document.getElementById("newBrand");
const newLineEl = document.getElementById("newLine");
const localDbPanelEl = document.getElementById("localDbPanel");
const toggleDbBtnEl = document.getElementById("toggleDbBtn");
const flavourEl = document.getElementById("flavour");
const flavourHint = document.getElementById("flavourHint");
const qtyEl = document.getElementById("qty");
const orderTable = document.getElementById("orderTable");
const orderOutput = document.getElementById("orderOutput");
const msg = document.getElementById("msg");
const msgContainer = document.getElementById("msgContainer");
const itemCountEl = document.getElementById("itemCount");

function unique(arr, key) {
  return [...new Set(arr.map(i => i[key]))];
}
function fill(el, values) {
  el.innerHTML = values.map(v => `<option value="${v}">${v}</option>`).join("");
}

function mergeCategories() {
  return [...new Set([...categories, ...unique(products, "category")])];
}

function sanitizeProduct(entry) {
  return {
    category: String(entry.category || "").trim(),
    brand: String(entry.brand || "").trim(),
    line: String(entry.line || "").trim()
  };
}

function loadProducts() {
  const saved = localStorage.getItem(PRODUCT_STORAGE_KEY);
  if (!saved) return [...defaultProducts];

  try {
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed)) return [...defaultProducts];

    const cleaned = parsed
      .map(sanitizeProduct)
      .filter(p => p.category && p.brand && p.line);
    if (!cleaned.length) return [...defaultProducts];

    const merged = [...defaultProducts];
    cleaned.forEach(item => {
      const exists = merged.some(p =>
        p.category.toLowerCase() === item.category.toLowerCase() &&
        p.brand.toLowerCase() === item.brand.toLowerCase() &&
        p.line.toLowerCase() === item.line.toLowerCase()
      );
      if (!exists) merged.push(item);
    });

    return merged;
  } catch {
    return [...defaultProducts];
  }
}

function loadCategories() {
  const saved = localStorage.getItem(CATEGORY_STORAGE_KEY);
  const fallback = unique(defaultProducts, "category");
  if (!saved) return fallback;

  try {
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed)) return fallback;

    const cleaned = parsed
      .map(item => String(item || "").trim())
      .filter(Boolean);

    return cleaned.length ? [...new Set([...cleaned, ...fallback])] : fallback;
  } catch {
    return fallback;
  }
}

function saveProducts() {
  localStorage.setItem(PRODUCT_STORAGE_KEY, JSON.stringify(products));
}

function saveCategories() {
  localStorage.setItem(CATEGORY_STORAGE_KEY, JSON.stringify(categories));
}

function showMessage(text, tone = "success") {
  msgContainer.classList.remove("hidden", "bg-green-50", "border-green-200", "bg-amber-50", "border-amber-200");
  msg.classList.remove("text-green-700", "text-amber-700");

  if (tone === "warning") {
    msgContainer.classList.add("bg-amber-50", "border", "border-amber-200");
    msg.classList.add("text-amber-700");
  } else {
    msgContainer.classList.add("bg-green-50", "border", "border-green-200");
    msg.classList.add("text-green-700");
  }

  msg.textContent = text;

  setTimeout(() => {
    msgContainer.classList.add("hidden");
  }, 3000);
}

function toggleLocalDbPanel() {
  localDbPanelEl.classList.toggle("hidden");
  toggleDbBtnEl.textContent = localDbPanelEl.classList.contains("hidden") ? "Add Category" : "Hide Category";
}

function init() {
  syncCategorySelectors();
  categoryEl.onchange = updateBrands;
  brandEl.onchange = updateLines;
  updateBrands();
}

function syncCategorySelectors(selectedCategory = categoryEl.value) {
  const allCategories = mergeCategories();
  fill(categoryEl, allCategories);
  fill(manageCategoryEl, allCategories);

  if (allCategories.includes(selectedCategory)) {
    categoryEl.value = selectedCategory;
    manageCategoryEl.value = selectedCategory;
  }
}

function updateBrands() {
  fill(brandEl, unique(products.filter(p => p.category === categoryEl.value), "brand"));
  manageCategoryEl.value = categoryEl.value;
  updateLines();
}

function updateLines() {
  fill(lineEl, unique(products.filter(p => 
    p.category === categoryEl.value && p.brand === brandEl.value
  ), "line"));
}

/* FLAVOUR LIST */
const dl = document.createElement("datalist");
dl.id = "flavourList";
document.body.appendChild(dl);

function normalizeFlavourText(value) {
  return value
    .toLowerCase()
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function getRelevantFlavours(query) {
  const normalizedQuery = normalizeFlavourText(query);
  const tokens = normalizedQuery.split(" ").filter(Boolean);
  const candidates = tokens.length
    ? flavourMasterList.filter(flavour => {
        const normalizedFlavour = normalizeFlavourText(flavour);
        return tokens.every(token => normalizedFlavour.includes(token));
      })
    : flavourMasterList;

  return candidates
    .map(flavour => {
      const normalizedFlavour = normalizeFlavourText(flavour);
      let score = 3;

      if (!tokens.length) score = 4;
      else if (normalizedFlavour === normalizedQuery) score = 0;
      else if (normalizedFlavour.startsWith(normalizedQuery)) score = 1;
      else if (tokens.some(token => normalizedFlavour.startsWith(token))) score = 2;

      return { flavour, score };
    })
    .sort((a, b) => (a.score - b.score) || a.flavour.localeCompare(b.flavour))
    .slice(0, 40)
    .map(item => item.flavour);
}

function refreshFlavourOptions(query = "") {
  const trimmedQuery = query.trim();
  if (!trimmedQuery) {
    dl.innerHTML = "";
    return;
  }

  const relevant = getRelevantFlavours(query);
  dl.innerHTML = relevant.map(flavour => `<option value="${flavour}">`).join("");
}

flavourEl.addEventListener("input", () => {
  const v = flavourEl.value.trim();
  refreshFlavourOptions(v);
  const normalizedInput = normalizeFlavourText(v);

  flavourHint.textContent = 
    v && !flavourMasterList.some(f => normalizeFlavourText(f) === normalizedInput)
      ? "New flavor detected"
      : "";
});

flavourEl.addEventListener("change", () => {
  const normalizedInput = normalizeFlavourText(flavourEl.value.trim());
  const exactMatch = flavourMasterList.find(f => normalizeFlavourText(f) === normalizedInput);
  if (!exactMatch) return;

  // Snap to canonical flavour name, then add instantly for fast repeat entry.
  flavourEl.value = exactMatch;
  addToOrder();
});

/* ORDER LOGIC */
function addToOrder() {
  const flavourValue = flavourEl.value.trim();
  const qtyValue = Number(qtyEl.value);

  if (!brandEl.value || !lineEl.value) {
    showMessage("Please select a brand and model first", "warning");
    return;
  }
  if (!flavourValue) {
    showMessage("Please enter a flavor", "warning");
    return;
  }
  if (!Number.isFinite(qtyValue) || qtyValue < 1) {
    showMessage("Quantity must be at least 1", "warning");
    qtyEl.value = 1;
    return;
  }

  order.push({
    category: categoryEl.value,
    brand: brandEl.value,
    line: lineEl.value,
    flavour: flavourValue,
    qty: Math.floor(qtyValue)
  });

  flavourEl.value = "";
  qtyEl.value = 1;
  refreshFlavourOptions("");
  flavourHint.textContent = "";
  renderOrder();
  flavourEl.focus();
}

function addCategory() {
  const category = newCategoryEl.value.trim();
  if (!category) return;

  const exists = mergeCategories().some(item => item.toLowerCase() === category.toLowerCase());
  if (exists) {
    showMessage("Category already exists", "warning");
    return;
  }

  categories.push(category);
  categories = [...new Set(categories)];
  saveCategories();
  syncCategorySelectors(category);
  updateBrands();
  newCategoryEl.value = "";
  showMessage(`Category "${category}" added`);
}

function addBrandEntry() {
  const category = manageCategoryEl.value.trim();
  const brand = newBrandEl.value.trim();
  const line = newLineEl.value.trim();

  if (!category || !brand || !line) {
    showMessage("Category, brand and model are required", "warning");
    return;
  }

  const exists = products.some(p =>
    p.category.toLowerCase() === category.toLowerCase() &&
    p.brand.toLowerCase() === brand.toLowerCase() &&
    p.line.toLowerCase() === line.toLowerCase()
  );

  if (exists) {
    showMessage("That brand/model already exists", "warning");
    return;
  }

  products.push({ category, brand, line });
  saveProducts();
  syncCategorySelectors(category);
  updateBrands();
  brandEl.value = brand;
  updateLines();
  lineEl.value = line;
  newBrandEl.value = "";
  newLineEl.value = "";
  showMessage(`Added ${brand} ${line}`);
}

function renderOrder() {
  if (order.length === 0) {
    orderTable.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400 italic">No items added yet.</td></tr>`;
    orderOutput.value = "";
    itemCountEl.textContent = "0 Items";
    return;
  }

  itemCountEl.textContent = `${order.length} ${order.length === 1 ? "Item" : "Items"}`;

  orderTable.innerHTML = order.map((i, idx) => `
    <tr class="hover:bg-slate-50">
      <td class="p-3 font-medium text-slate-400">${idx + 1}</td>
      <td class="p-3">
        <div class="font-bold text-slate-900">${i.brand}</div>
        <div class="text-[10px] text-slate-500">${i.line}</div>
      </td>
      <td class="p-3">${i.flavour}</td>
      <td class="p-3 text-right font-bold">${i.qty}</td>
      <td class="p-3 text-right">
        <button type="button" onclick="removeOrderItem(${idx})"
          class="text-[11px] px-2 py-1 rounded-md bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100">
          Del
        </button>
      </td>
    </tr>
  `).join("");

  const models = [];
  order.forEach(item => {
    const modelKey = `${item.brand}||${item.line}`.toLowerCase();
    let model = models.find(entry => entry.key === modelKey);
    if (!model) {
      model = {
        key: modelKey,
        brand: item.brand,
        line: item.line,
        flavours: []
      };
      models.push(model);
    }

    const flavourKey = item.flavour.toLowerCase();
    const existingFlavour = model.flavours.find(entry => entry.key === flavourKey);
    if (existingFlavour) {
      existingFlavour.qty += item.qty;
    } else {
      model.flavours.push({
        key: flavourKey,
        name: item.flavour,
        qty: item.qty
      });
    }
  });

  let whatsappText = `*VAPE ORDER SUMMARY*\n`;
  whatsappText += `--------------------------\n\n`;

  models.forEach((model, idx) => {
    whatsappText += `${idx + 1}. *${model.brand} ${model.line}*\n`;
    model.flavours.forEach(flavour => {
      whatsappText += `   \u2022 ${flavour.name} (x${flavour.qty})\n`;
    });
    whatsappText += `\n`;
  });

  const totalUnits = order.reduce((sum, item) => sum + item.qty, 0);
  whatsappText += `--------------------------\n`;
  whatsappText += `*Total Unique Models:* ${models.length}\n`;
  whatsappText += `*Total Units:* ${totalUnits}`;

  orderOutput.value = whatsappText;
}

function removeOrderItem(index) {
  if (index < 0 || index >= order.length) return;
  order.splice(index, 1);
  renderOrder();
}

async function copyOrder() {
  if (order.length === 0) return;
  const text = orderOutput.value;

  try {
    await navigator.clipboard.writeText(text);
    showMessage("Copied to clipboard!");
    return;
  } catch {}

  orderOutput.select();
  const copied = document.execCommand("copy");
  showMessage(copied ? "Copied to clipboard!" : "Copy failed. Please copy manually.", copied ? "success" : "warning");
}

flavourEl.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    addToOrder();
  }
});

qtyEl.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    addToOrder();
  }
});

// Mobile fix: allow one-tap add even when flavour datalist/keyboard is open.
addToOrderBtnEl.addEventListener("pointerdown", e => {
  if (document.activeElement === flavourEl) {
    e.preventDefault();
    addToOrder();
  }
});

addToOrderBtnEl.addEventListener("click", addToOrder);

init();
</script>
